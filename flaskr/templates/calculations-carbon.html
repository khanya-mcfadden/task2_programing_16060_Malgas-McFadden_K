<!DOCTYPE html>
<html lang="en">
  {% extends 'index.html' %}
  {% block title %}
    energy calculation
  {% endblock %}

  {% block content %}
    <div class="container bg-success text-white text-center py-4" style="height: 100%; background: linear-gradient(0deg, rgba(0, 138, 0, 0.5) 0%, rgba(1, 238, 184, 0.5) 100%);">
      <h1>Energy Calculation</h1>
      <p>Calculate the energy consumption of your home</p>
      <!-- building questions -->
      <form method="POST" action="/calculations-energy" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="home-size" class="form-label">how large is your home or office in ft:</label>
          <input type="home-size" id="home-size" name="home-size" class="form-control" required />
        </div>

        <div class="mb-3 d-none" id="step-2">
          <label for="heating-type" class="form-label">how do you heat your home or office:</label>
          <select id="heating-type" name="heating-type" class="form-select" required>
            <option value="gas">Gas</option>
            <option value="Electricity">Electricity</option>
            <option value="Oil">Oil</option>
            <option value="Wood">Wood</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- installation Information -->
        <div id="heating-info" class="mb-3" style="display: none;">
          <label for="other-name" class="form-label">Please provide the name of how you heat your house</label>
          <textarea id="other-name" name="installation-details" class="form-control"></textarea>

          <label for="heating-choice" class="form-label">Does it generate energy or use a resource</label>
          <select id="heating-choice" name="heating-type" class="form-select" required>
            <option value="use_resource">Use resource</option>
            <option value="generate">Generate energy</option>
          </select>

          <div id="other-gen-container" style="display: none;">
            <label for="other-gen" class="form-label">How much energy does it make on average in an hour:</label>
            <textarea id="other-gen" name="energy-generation" class="form-control"></textarea>
          </div>
        </div>

        <!-- forward and back buttons -->
        <button type="button" class="btn btn-secondary d-none" id="back-button">Back</button>
        <button type="button" class="btn btn-primary" id="next-button">Next</button>
        <button type="submit" class="btn btn-success d-none" id="submit-button">Calculate</button>
      </form>
    </div>

    <!-- Toggles visibility of other-info based on user selection -->
    <script>
      document.getElementById('heating-type').addEventListener('change', function () {
        const installationInfo = document.getElementById('heating-info')
        if (this.value === 'Other') {
          installationInfo.style.display = 'block'
        } else {
          installationInfo.style.display = 'none'
        }
      
        // Ensure heating type dropdown stays visible
        this.style.display = 'block'
      })
    </script>

    <!-- forward and back button function -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const steps = Array.from(document.querySelectorAll('form .mb-3'))
        const nextButton = document.getElementById('next-button')
        const backButton = document.getElementById('back-button')
        const submitButton = document.getElementById('submit-button')
        let currentStep = 0
      
        function updateButtons() {
          backButton.classList.toggle('d-none', currentStep === 0)
          nextButton.classList.toggle('d-none', currentStep === steps.length - 1)
          submitButton.classList.toggle('d-none', currentStep !== steps.length - 1)
        }
      
        nextButton.addEventListener('click', function () {
          if (currentStep < steps.length - 1) {
            steps[currentStep].classList.add('d-none')
            currentStep++
            steps[currentStep].classList.remove('d-none')
            updateButtons()
          }
        })
      
        backButton.addEventListener('click', function () {
          if (currentStep > 0) {
            steps[currentStep].classList.add('d-none')
            currentStep--
            steps[currentStep].classList.remove('d-none')
            updateButtons()
          }
        })
      
        updateButtons()
      })
    </script>

    <!-- Display the selected installation choice -->
    <script>
      document.getElementById('heating-type').addEventListener('change', function () {
        const choiceDisplay = document.getElementById('heating-type')
        choiceDisplay.textContent = this.value
      })
    </script>

    <!-- heating-choice script -->
    <script>
      document.getElementById('heating-choice').addEventListener('change', function () {
        const otherGenContainer = document.getElementById('other-gen-container')
        if (this.value === 'generate') {
          otherGenContainer.style.display = 'block'
        } else {
          otherGenContainer.style.display = 'none'
        }
      })
    </script>
  {% endblock %}
</html>
