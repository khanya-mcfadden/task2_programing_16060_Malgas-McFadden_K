<!DOCTYPE html>
<html lang="en">

{% extends "index.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<Body>
    <form method="post" action="/submit-form" style="content-align: center; position: relative; width: 100%; height: 1024px; background: #FFFFFF; border: 1px solid #000000; box-sizing: border-box;">
        <!-- Background -->
        <div style="width: 1440px; height: 912px; left: 0px; top: 112px; position: absolute; background: linear-gradient(180deg, white 12%, rgba(65, 178, 113, 0.50) 89%, rgba(27.75, 76, 48.25, 0.50) 100%)"></div>
        <div style="width: 1133px; height: 825px; left: 149px; top: 155px; position: absolute; background: white; border-radius: 15px"></div>
        <div style="width: 486px; height: 641px; left: 775px; top: 222px; position: absolute; background: linear-gradient(0deg, #41B271 34%, #10E9B8 100%); border-top-left-radius: 15px; border-bottom-right-radius: 15px"></div>
        <!-- inputs -->
        <label for="first_name" style="width: 256px; height: 31px; left: 192px; top: 226px; position: absolute;">
            <span style="color: black; font-size: 36px; font-family: Source Serif Pro; font-weight: 400;">First Name *</span>
        </label>
        <input type="text" id="first_name" name="first_name" required style="width: 261px; height: 49px; left: 182px; top: 279px; position: absolute; background: #FAFAFA; border-radius: 15px; border: 1px #BABABA solid;">
        
        <label for="last_name" style="width: 256px; height: 31px; left: 477px; top: 226px; position: absolute;">
            <span style="color: black; font-size: 36px; font-family: Source Serif Pro; font-weight: 400;">Last Name *</span>
        </label>
        <input type="text" id="last_name" name="last_name" required style="width: 261px; height: 49px; left: 472px; top: 279px; position: absolute; background: #FAFAFA; border-radius: 15px; border: 1px #BABABA solid;">
        
        <label for="email" style="width: 256px; height: 31px; left: 187px; top: 342px; position: absolute;">
            <span style="color: black; font-size: 36px; font-family: Source Serif Pro; font-weight: 400;">Email Address *</span>
        </label>
        <input type="email" id="email" name="email" required style="width: 261px; height: 49px; left: 182px; top: 397px; position: absolute; background: #FAFAFA; border-radius: 15px; border: 1px #BABABA solid;">
        
        <label for="phone" style="width: 294px; height: 31px; left: 481px; top: 340px; position: absolute;">
            <span style="color: black; font-size: 36px; font-family: Source Serif Pro; font-weight: 400;">Phone Number *</span>
        </label>
        <input type="tel" id="phone" name="phone" required style="width: 261px; height: 49px; left: 472px; top: 397px; position: absolute; background: #FAFAFA; border-radius: 15px; border: 1px #BABABA solid;">
        
        <label for="postcode" style="width: 256px; height: 31px; left: 185px; top: 466px; position: absolute;">
            <span style="color: black; font-size: 36px; font-family: Source Serif Pro; font-weight: 400;">Post Code *</span>
        </label>
        <input type="text" id="postcode" name="postcode" required style="width: 261px; height: 49px; left: 182px; top: 515px; position: absolute; background: #FAFAFA; border-radius: 15px; border: 1px #BABABA solid;">
        <!-- Messages -->
        <label for="message" style="width: 465px; height: 36px; left: 178px; top: 574px; position: absolute;">
            <span style="color: black; font-size: 20px; font-family: Source Serif Pro; font-weight: 400;">Add a Message</span>
        </label>
        <textarea id="message" name="message" style="width: 538px; height: 210px; left: 178px; top: 610px; position: absolute; background: #F9F9F9; border: 1.50px rgba(0, 0, 0, 0.50) solid;"></textarea>
        
        <div style="width: 465px; height: 36px; left: 226px; top: 827px; position: absolute;">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree" style="color: black; font-size: 20px; font-family: Source Serif Pro; font-weight: 400;">By clicking this box you agree to be contacted by the Rose Technologies company</label>
        </div>
        
        <button type="submit" style="width: 427px; height: 59px; left: 201px; top: 888px; position: absolute; background: linear-gradient(180deg, rgba(4.01, 160.44, 14.44, 0.50) 62%, rgba(12.77, 121.12, 7.07, 0.50) 100%); box-shadow: 1px 4px 4px rgba(0, 0, 0, 0.25); border-top-left-radius: 10px; border-bottom-right-radius: 10px; outline: 0.50px rgba(0, 0, 0, 0.50) solid; outline-offset: -0.25px;">
            <span style="color: black; font-size: 48px; font-family: Source Serif Pro; font-weight: 400;">Submit</span>
        </button>
    </form>

{% endblock%}
</Body>
