<!DOCTYPE html>
<html lang="en">
  {% extends 'index.html' %}
  {% block title %}
    Booking Page
  {% endblock %}
  {% block content %}
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>

    <body>
      <div class="container my-5" style="border-radius: 10px; background-color: rgba(0, 109, 9, 0.41);">
        <form method="POST" action="/booking" class="needs-validation" novalidate>
          <h1 class="text-center mb-4">Welcome to our Booking Page!</h1>
          <p class="text-center">Please select a course and date to make a reservation:</p>

          <!-- Date and Time -->
          <div class="mb-3">
            <label for="date" class="form-label">Select a date:</label>
            <input type="date" id="date" name="date" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="time" class="form-label">Select a time:</label>
            <input type="time" id="time" name="time" class="form-control" required />
          </div>
          <!-- installation Selection -->
          <div class="mb-3">
            <label for="installation" class="form-label">do you want a consultation or installation?</label>
            <select id="installation" name="is_installation" class="form-select" required>
              <option value="consultation">consultation</option>
              <option value="installation">installation</option>
            </select>
          </div>

          <!-- installation Information -->
          <div id="installation-info" class="mb-3" style="display: none;">
            <lable for="installation-choice" class="form-label">Please select the type of installation:</lable>
            <select id="installation-choice" name="installation_choice" class="form-select">
              <option value="solar panels">solar panels</option>
              <option value="ev chargers">ev chargers</option>
            </select>
            <label for="installation-number" class="form-label">Please provide the number of <span id="installation-choice-display"></span> you want:</label>
            <input type="number" id="installation-number" name="installation_number" class="form-control" />

            <label for="installation-details" class="form-label">Please provide additional details for the installation:</label>
            <textarea id="installation-details" name="installation_details" class="form-control"></textarea>
          </div>

          <!-- Personal Information -->
          <div class="mb-3">
            <label for="first_name" class="form-label">First Name *</label>
            <input type="text" id="first_name" name="first_name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="last_name" class="form-label">Last Name *</label>
            <input type="text" id="last_name" name="last_name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address *</label>
            <input type="email" id="email" name="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number *</label>
            <input type="tel" id="phone" name="phone" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="postcode" class="form-label">Post Code *</label>
            <input type="text" id="postcode" name="postcode" class="form-control" required />
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label for="message" class="form-label">Add a Message</label>
            <textarea id="message" name="message" class="form-control"></textarea>
          </div>

          <!-- Agreement Checkbox -->
          <div class="form-check mb-3">
            <input type="checkbox" id="agree" name="agree" class="form-check-input" required />
            <label for="agree" class="form-check-label">By clicking this box, you agree to be contacted by Rose Technologies company.</label>
          </div>

          <!-- Submit Button -->
          <div class="text-center">
            <button type="submit" class="btn btn-lg" style=" background: linear-gradient(180deg, rgba(4.01, 160.44, 14.44, 0.50) 62%, rgba(12.77, 121.12, 7.07, 0.50) 100%); box-shadow: 1px 4px 4px rgba(0, 0, 0, 0.25); border-top-left-radius: 10px; border-bottom-right-radius: 10px; outline: 0.50px rgba(0, 0, 0, 0.50">Book Now</button>
          </div>
        </form>
      </div>

      <!-- Bootstrap JS -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
      <!-- Display the selected installation choice -->
      <script>
        document.getElementById('installation-choice').addEventListener('change', function () {
          const choiceDisplay = document.getElementById('installation-choice-display')
          choiceDisplay.textContent = this.value
        })
      </script>

      <!-- number limit for installation -->
      <script>
        document.getElementById('installation-choice').addEventListener('change', function () {
          const installationNumber = document.getElementById('installation-number')
          if (this.value === 'ev chargers') {
            installationNumber.max = 5
            if (installationNumber.value > 5) {
              installationNumber.value = 5
            }
          } else if (this.value === 'solar panels') {
            installationNumber.max = 10
            if (installationNumber.value > 10) {
              installationNumber.value = 10
            }
          } else {
            installationNumber.removeAttribute('max')
          }
        })
        
        document.getElementById('installation-number').addEventListener('input', function () {
          const max = this.max
          if (max && this.value > max) {
            this.value = max
          }
        })
      </script>

      <!-- Toggles visibility of installation-info based on user selection -->
      <script>
        document.getElementById('installation').addEventListener('change', function () {
          const installationInfo = document.getElementById('installation-info')
          if (this.value === 'installation') {
            installationInfo.style.display = 'block'
          } else {
            installationInfo.style.display = 'none'
          }
        })
      </script>
    </body>
  {% endblock %}
</html>
