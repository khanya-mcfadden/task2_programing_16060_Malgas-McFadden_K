<!DOCTYPE html>
<html lang="en">
  {% extends 'index.html' %}
  {% block title %}
    Booking Page
  {% endblock %}
  {% block content %}
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>

    <body>
      <div class="container my-5" style="border-radius: 10px; background-color: rgba(0, 109, 9, 0.41);">
        
        
        <form method="POST" action="/contact" class="needs-validation" novalidate>
          <h1 class="text-center mb-4">Welcome to our Contact Page!</h1>
          <h2 class="text-center">Please tell us your reason for you contact and we will respond:</h2>

          <!-- error Selection -->
          <div class="mb-3">
            <label for="is_error" class="form-label">why are you contacting:</label>
            <select id="is_error" name="is_error" class="form-select" required>
              <option value="consultation">feedback</option>
              <option value="error">error</option>
            </select>
          </div>

          <!-- is it a error Information -->
          <div id="what-error" class="mb-3" style="display: none;">
            <lable for="error-choice" class="form-label">what was the error:</lable>
            <select id="error-choice" name="error_choice" class="form-select">
              <option value="404">missing page</option>
              <option value="500">server error</option>
              <option value="other">other</option>
            </select>

            <label for="error-message" class="form-label">Please describ what happened befor the <span id="error-choice-display"></span> error</label>
            <textarea id="error-message" name="error-message" class="form-control"></textarea>

            <label for="error-details" class="form-label">Please provide any additional details about the error:</label>
            <textarea id="error-details" name="error_details" class="form-control"></textarea>
          </div>

          <!-- Personal Information -->
          <div class="mb-3">
            <label for="email" class="form-label">Email Address *</label>
            <input type="email" id="email" name="email" class="form-control" required />
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label for="message" class="form-label">type your feedback here</label>
            <textarea id="message" name="message" class="form-control"></textarea>
          </div>

          <!-- Agreement Checkbox -->
          <div class="form-check mb-3">
            <input type="checkbox" id="agree" name="agree" class="form-check-input" required />
            <label for="agree" class="form-check-label">By clicking this box, you agree to be contacted by Rose Technologies company.</label>
          </div>

          <!-- Submit Button -->
          <div class="text-center">
            <button type="submit" class="btn btn-lg" style=" background: linear-gradient(180deg, rgba(4.01, 160.44, 14.44, 0.50) 62%, rgba(12.77, 121.12, 7.07, 0.50) 100%); box-shadow: 1px 4px 4px rgba(0, 0, 0, 0.25); border-top-left-radius: 10px; border-bottom-right-radius: 10px; outline: 0.50px rgba(0, 0, 0, 0.50">Book Now</button>
          </div>
        </form>
      </div>

      <!-- Bootstrap JS -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
      <!-- Display the selected error choice -->
      <script>
        document.getElementById('error-choice').addEventListener('change', function () {
          const choiceDisplay = document.getElementById('error-choice-display')
          choiceDisplay.textContent = this.value
        })
      </script>


      <!-- Toggles visibility of error-message based on user selection -->
      <script>
        document.getElementById('is_error').addEventListener('change', function () {
          const errorInfo = document.getElementById('what-error')
          if (this.value === 'error') {
            errorInfo.style.display = 'block'
          } else {
            errorInfo.style.display = 'none'
          }
        })
      </script>
    </body>
  {% endblock %}
</html>
