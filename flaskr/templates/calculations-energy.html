<!DOCTYPE html>
<html lang="en">

{% extends "index.html" %}
{% block title %}energy calculation{% endblock %}

{% block content %}

<div class="container bg-success text-white text-center py-4" style="height: 100%; background: linear-gradient(0deg, rgba(0, 138, 0, 0.5) 0%, rgba(1, 238, 184, 0.5) 100%);">
    <h1>Energy Calculation</h1>
    <p>Calculate the energy consumption of your home</p>

    <form method="POST" action="/calculations-energy" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="energy" class="form-label">Enter the energy consumption of your home in Kilo Watt's per Hour :</label>
            <input type="number" id="energy" name="energy" class="form-control" required />
        </div>

        <div class="mb-3 d-none" id="step-2">
            <label for="cost" class="form-label">Enter the cost of energy in your area in pence:</label>
            <input type="number" id="cost" name="cost" class="form-control" required />
        </div>

        <div class="mb-3 d-none" id="step-3">
            <label for="time" class="form-label">Enter the time period in months:</label>
            <input type="number" id="time" name="time" class="form-control" required />
        </div>


        <button type="button" class="btn btn-secondary d-none" id="back-button">Back</button>
        <button type="button" class="btn btn-primary" id="next-button">Next</button>
        <button type="submit" class="btn btn-success d-none" id="submit-button">Calculate</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const steps = Array.from(document.querySelectorAll("form .mb-3"));
        const nextButton = document.getElementById("next-button");
        const backButton = document.getElementById("back-button");
        const submitButton = document.getElementById("submit-button");
        let currentStep = 0;

        function updateButtons() {
            backButton.classList.toggle("d-none", currentStep === 0);
            nextButton.classList.toggle("d-none", currentStep === steps.length - 1);
            submitButton.classList.toggle("d-none", currentStep !== steps.length - 1);
        }

        nextButton.addEventListener("click", function () {
            if (currentStep < steps.length - 1) {
                steps[currentStep].classList.add("d-none");
                currentStep++;
                steps[currentStep].classList.remove("d-none");
                updateButtons();
            }
        });

        backButton.addEventListener("click", function () {
            if (currentStep > 0) {
                steps[currentStep].classList.add("d-none");
                currentStep--;
                steps[currentStep].classList.remove("d-none");
                updateButtons();
            }
        });

        updateButtons();
    });
</script>

{% endblock%}
